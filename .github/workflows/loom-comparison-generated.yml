name: Loom comparison generated-doc preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full contribution commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  generated:
    name: Native committed sitemap and generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zlareb1/deja-vu
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
          cache: false
      - name: Verify the checked-out commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"'
      - name: Native committed sitemap check
        run: go test ./cmd/deja -run TestSitemapLastmodFollowsThePages -count 1
      - name: The generators write what is committed
        shell: bash
        run: |
          go run ./scripts/gennav
          go run ./scripts/genmatrix
          go run ./scripts/genregistry
          go run ./scripts/genfeed
          # --porcelain rather than `git diff`, because a generator that adds a
          # page writes an untracked file and a diff of tracked files does not
          # see it: genregistry writes one per harness, so the first run after a
          # parser lands is exactly the case this has to catch.
          #
          # A squash merge re-dates the commit that carries a page, so a page
          # merged the UTC day after its PR's last commit regenerates one day
          # later on main and nothing else changes (#5032). Drift that is only
          # in lastmod and dateModified passes here, and so does the feed when
          # one moved, since the feed is the newest pages by those dates. Inside
          # a pull request the dates come from its own commits and do not move,
          # so a feed nobody regenerated still fails there. TestSitemapLastmodFollowsThePages
          # holds the dates to within a week, and the next regeneration commits
          # the new day.
          norm() { sed -E 's/(<lastmod>|"dateModified": ")[0-9]{4}-[0-9]{2}-[0-9]{2}/\1DATE/g'; }
          stale=
          dated=
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then stale=1; fi
          for f in $(git diff --name-only); do
            if [ "$f" = docs/feed.xml ]; then continue; fi
            if cmp -s <(git show "HEAD:$f" | norm) <(norm < "$f"); then dated=1; else stale=1; fi
          done
          if ! git diff --quiet -- docs/feed.xml && [ -z "$dated" ]; then stale=1; fi
          if [ -n "$(git status --porcelain)" ] && [ -z "$stale" ]; then
            echo "::notice::Only page dates moved, as after a squash merge on a later day (#5032):"
            git --no-pager diff --stat
          elif [ -n "$stale" ]; then
            echo "::error::A generated file is not what its generator writes. Run:"
            echo "::error::  go run ./scripts/gennav && go run ./scripts/genmatrix && go run ./scripts/genregistry && go run ./scripts/genfeed"
            git --no-pager status --short
            git --no-pager diff --stat
            exit 1
          fi
      - name: Source receipt
        if: always()
        run: |
          git rev-parse HEAD
          git status --short
